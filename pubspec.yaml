name: tmd_prototype
description: "Real-time transport mode detection using on-device Sydney models"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^7.0.0
  flutter_activity_recognition: ^4.0.0
  flutter_onnxruntime: ^1.7.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/sydney/
    - assets/sydney/models/
    - assets/sydney/fixtures/
